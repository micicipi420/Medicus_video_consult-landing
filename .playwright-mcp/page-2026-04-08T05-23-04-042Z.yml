            - generic [ref=e383]: Как вы выбираете клинику?
            - img [ref=e384]
          - generic [ref=e387]: Мы не привязаны к одной клинике и не продаём «свою» больницу. Наш координатор анализирует вашу медицинскую историю, определяет, какая клиника и какой врач специализируются именно на вашем случае, и предлагает варианты с обоснованием. При необходимости —организуем второе мнение от врачей из разных стран до поездки.
        - generic [ref=e388]:
          - button "Сколько это стоит?" [ref=e389]:
            - generic [ref=e390]: Сколько это стоит?
            - img [ref=e391]
          - generic [ref=e394]: Стоимость зависит от диагноза, страны и объёма лечения. Средний бюджет наших пациентов —от 5 000 до 20 000 €, но сложные случаи (онкология, трансплантология) могут стоить больше. Первая консультация и подготовка плана лечения —бесплатно. Вы получаете детальную смету до принятия решения, без скрытых доплат.
        - generic [ref=e395]:
          - button "Можно ли поговорить с врачом до поездки?" [ref=e396]:
            - generic [ref=e397]: Можно ли поговорить с врачом до поездки?
            - img [ref=e398]
          - generic [ref=e401]: Да. Мы организуем онлайн-консультацию с профильным врачом из клиники до вашего вылета. Врач уже будет знать вашу историю —вы обсудите план лечения, зададите вопросы и примете решение, стоит ли ехать. Это снижает риск «приехал —а врач не тот».
