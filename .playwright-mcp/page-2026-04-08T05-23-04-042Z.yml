          - generic [ref=e380]: "Мы работаем с широким спектром направлений: онкология, кардиология, ортопедия, неврология, трансплантология, педиатрия, офтальмология и другие. Если вам поставили диагноз и вы рассматриваете лечение за рубежом —опишите свой случай, и мы скажем, можем ли помочь и куда лучше обратиться."
