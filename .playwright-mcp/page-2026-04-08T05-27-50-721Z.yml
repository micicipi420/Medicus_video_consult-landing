            - img [ref=e427]
          - generic [ref=e430]: "Можете. Но вот что вы получите с нами: приоритетную запись через прямой контракт (а не общую очередь через сайт клиники), медицинского координатора, который сверяет показания до поездки, переводчика на всех приёмах, полную логистику и наблюдение после возвращения. Вы экономите недели на организации и снижаете риск выбрать не ту клинику."
