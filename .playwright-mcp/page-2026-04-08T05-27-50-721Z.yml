        - generic [ref=e417]:
          - button "Чем вы отличаетесь от агентств, которые предлагают то же самое?" [ref=e418]:
            - generic [ref=e419]: Чем вы отличаетесь от агентств, которые предлагают то же самое?
            - img [ref=e420]
          - generic [ref=e423]: "Три главных отличия. Первое —у нас есть собственная цифровая платформа с личным кабинетом, а не переписка в мессенджере. Второе —вы подписываете договор с юридическим лицом в Казахстане, а не переводите деньги на карту физлицу. Третье —мы не исчезаем после лечения: переводим документы, координируем наблюдение с врачами дома, организуем контрольные консультации."
