            - generic [ref=e384]: С какими заболеваниями можно обратиться?
            - img [ref=e385]
          - generic [ref=e388]: "Мы работаем с широким спектром направлений: онкология, кардиология, ортопедия, неврология, трансплантология, педиатрия, офтальмология и другие. Если вам поставили диагноз и вы рассматриваете лечение за рубежом —опишите свой случай, и мы скажем, можем ли помочь и куда лучше обратиться."
        - generic [ref=e389]:
          - button "Как вы выбираете клинику?" [ref=e390]:
            - generic [ref=e391]: Как вы выбираете клинику?
            - img [ref=e392]
          - generic [ref=e395]: Мы не привязаны к одной клинике и не продаём «свою» больницу. Наш координатор анализирует вашу медицинскую историю, определяет, какая клиника и какой врач специализируются именно на вашем случае, и предлагает варианты с обоснованием. При необходимости —организуем второе мнение от врачей из разных стран до поездки.
        - generic [ref=e396]:
          - button "Сколько это стоит?" [ref=e397]:
            - generic [ref=e398]: Сколько это стоит?
            - img [ref=e399]
          - generic [ref=e402]: Стоимость зависит от диагноза, страны и объёма лечения. Средний бюджет наших пациентов —от 5 000 до 20 000 €, но сложные случаи (онкология, трансплантология) могут стоить больше. Первая консультация и подготовка плана лечения —бесплатно. Вы получаете детальную смету до принятия решения, без скрытых доплат.
        - generic [ref=e403]:
          - button "Можно ли поговорить с врачом до поездки?" [ref=e404]:
            - generic [ref=e405]: Можно ли поговорить с врачом до поездки?
            - img [ref=e406]
          - generic [ref=e409]: Да. Мы организуем онлайн-консультацию с профильным врачом из клиники до вашего вылета. Врач уже будет знать вашу историю —вы обсудите план лечения, зададите вопросы и примете решение, стоит ли ехать. Это снижает риск «приехал —а врач не тот».
        - generic [ref=e410]:
          - button "Какие документы нужны?" [ref=e411]:
            - generic [ref=e412]: Какие документы нужны?
            - img [ref=e413]
