            - generic [ref=e380]: Как вы выбираете клинику?
            - img [ref=e381]
          - generic [ref=e384]: Мы не привязаны к одной клинике и не продаём «свою» больницу. Наш координатор анализирует вашу медицинскую историю, определяет, какая клиника и какой врач специализируются именно на вашем случае, и предлагает варианты с обоснованием. При необходимости — организуем второе мнение от врачей из разных стран до поездки.
        - generic [ref=e385]:
          - button "Сколько это стоит?" [ref=e386]:
            - generic [ref=e387]: Сколько это стоит?
            - img [ref=e388]
          - generic [ref=e391]: Стоимость зависит от диагноза, страны и объёма лечения. Средний бюджет наших пациентов — от 5 000 до 20 000 €, но сложные случаи (онкология, трансплантология) могут стоить больше. Первая консультация и подготовка плана лечения — бесплатно. Вы получаете детальную смету до принятия решения, без скрытых доплат.
        - generic [ref=e392]:
          - button "Можно ли поговорить с врачом до поездки?" [ref=e393]:
            - generic [ref=e394]: Можно ли поговорить с врачом до поездки?
            - img [ref=e395]
          - generic [ref=e398]: Да. Мы организуем онлайн-консультацию с профильным врачом из клиники до вашего вылета. Врач уже будет знать вашу историю — вы обсудите план лечения, зададите вопросы и примете решение, стоит ли ехать. Это снижает риск «приехал — а врач не тот».
