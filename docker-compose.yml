version: "3.8"

services:
  database:
    image: postgres:16-alpine
    restart: unless-stopped
    volumes:
      - pgdata:/var/lib/postgresql/data
    environment:
      POSTGRES_USER: ${DB_USER:-directus}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-directus}
      POSTGRES_DB: ${DB_DATABASE:-directus}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-directus}"]
      interval: 10s
      timeout: 5s
      retries: 5

  directus:
    image: directus/directus:11
    restart: unless-stopped
    ports:
      - "${DIRECTUS_PORT:-8055}:8055"
    depends_on:
      database:
        condition: service_healthy
    volumes:
      - directus_uploads:/directus/uploads
      - directus_extensions:/directus/extensions
    environment:
      # Database
      DB_CLIENT: pg
      DB_HOST: database
      DB_PORT: 5432
      DB_DATABASE: ${DB_DATABASE:-directus}
      DB_USER: ${DB_USER:-directus}
      DB_PASSWORD: ${DB_PASSWORD:-directus}

      # Security
      SECRET: ${DIRECTUS_SECRET:-change-me-to-a-random-string}
      ADMIN_EMAIL: ${DIRECTUS_ADMIN_EMAIL:-admin@medicusunion.kz}
      ADMIN_PASSWORD: ${DIRECTUS_ADMIN_PASSWORD:-change-me}

      # CORS (BACK-04)
      CORS_ENABLED: "true"
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:3000,https://medicusunion.kz,https://www.medicusunion.kz}
      CORS_METHODS: GET,POST,OPTIONS
      CORS_ALLOWED_HEADERS: Content-Type,Authorization
      CORS_CREDENTIALS: "true"

      # Public URL
      PUBLIC_URL: ${PUBLIC_URL:-http://localhost:8055}

volumes:
  pgdata:
  directus_uploads:
  directus_extensions:
